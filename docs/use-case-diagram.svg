<tspan x="1990" y="907.82">Extension point:</tspan>
<tspan x="1990" y="935.42">evidence found unacceptable</tspan>
</text>
<ellipse cx="1990" cy="1130" rx="235" ry="55" fill="#f7faf8" stroke="#264b39" stroke-width="2.8"/>
<text font-family="Arial, sans-serif" font-size="26" fill="#203b34" text-anchor="middle">
